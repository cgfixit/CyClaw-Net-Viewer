name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  test:
    name: Rust ${{ matrix.toolchain }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        toolchain: ['1.85.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install selected toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --component rustfmt --component clippy --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Record compiler and platform
        run: |
          rustc --version --verbose
          cargo --version
          uname -m
      - name: Validate
        run: ./scripts/check.sh
      - name: Release build
        run: cargo build --release --locked
      - name: Validate bundle metadata
        run: plutil -lint Info.plist
