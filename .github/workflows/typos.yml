name: Typos

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: typos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
