name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  coverage:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
        with:
          toolchain: 1.85.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage
      - name: Install Rust 1.85-compatible coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.6.16
      - name: Run unit, integration, and CLI subprocess tests with coverage
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - name: Generate browsable report without rerunning tests
        run: cargo llvm-cov report --html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            lcov.info
            target/llvm-cov/html/
          if-no-files-found: error
          retention-days: 14
