name: Bundle

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  app:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: make-app
        run: ./scripts/make-app.sh
      - name: check binary
        run: |
          test -x dist/CyClaw-Net-Viewer.app/Contents/MacOS/netboard
          lipo dist/CyClaw-Net-Viewer.app/Contents/MacOS/netboard -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/CyClaw-Net-Viewer.app
          dist/CyClaw-Net-Viewer.app/Contents/MacOS/netboard --cli -n -a > /dev/null
      - name: Archive with macOS permissions and metadata
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CyClaw-Net-Viewer.app dist/CyClaw-Net-Viewer.zip
          cd dist
          shasum -a 256 CyClaw-Net-Viewer.zip > CyClaw-Net-Viewer.zip.sha256
          mkdir verify
          ditto -x -k CyClaw-Net-Viewer.zip verify
          test -x verify/CyClaw-Net-Viewer.app/Contents/MacOS/netboard
          codesign --verify --deep --strict verify/CyClaw-Net-Viewer.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CyClaw-Net-Viewer-${{ github.sha }}
          path: |
            dist/CyClaw-Net-Viewer.zip
            dist/CyClaw-Net-Viewer.zip.sha256
          if-no-files-found: error
          retention-days: 14
