name: Workflow lint

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Actionlint 1.7.12
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      - name: Check workflow syntax and embedded shell
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      - name: Check macOS validation and packaging scripts
        run: shellcheck --severity=warning scripts/*.sh
