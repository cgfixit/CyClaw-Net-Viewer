version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @1.85.0 is the rustc pin, not an action semver line.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Remove a dependency-name ignore when Cargo.toml raises that pin
    # or rust-version / eframe MSRV allows the bump. Blanket ignore
    # mutes ALL versions of that crate (including safe patches).
    ignore:
      # Closed as rustc > 1.85.0 or a Cargo.toml exact pin (do not re-open).
      - dependency-name: eframe
      - dependency-name: egui_extras
      - dependency-name: image
      - dependency-name: icu_locale_core
      - dependency-name: icu_provider
      - dependency-name: socket2
