[package]
name = "netboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "macOS TCP/UDP endpoint viewer in Rust. Built to watch process egress on CyClaw."

[dependencies]
eframe = "=0.31.1"
egui_extras = { version = "=0.31.1", default-features = false }
netstat2 = "0.11"
libc = "0.2"
crossbeam-channel = "=0.5.16"
socket2 = "=0.5.10"
# eframe 0.31 pulls crates whose latest patch needs rustc > 1.85
image = { version = "=0.25.6", default-features = false, features = ["png"] }
url = "=2.5.8"
idna_adapter = "=1.2.1"
writeable = "=0.6.4"
icu_collections = "=2.0.0"
icu_locale_core = "=2.0.0"
icu_normalizer = "=2.0.1"
icu_normalizer_data = "=2.0.0"
icu_properties = "=2.0.2"
icu_properties_data = "=2.0.1"
icu_provider = "=2.0.0"

[lib]
name = "netboard"
path = "src/lib.rs"

[[bin]]
name = "netboard"
path = "src/main.rs"
